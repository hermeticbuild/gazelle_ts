name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bazel-test:
    name: bazel ${{ matrix.bazel }} test (linux-x86_64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel: ["9.0.0"]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-linux-x86_64-bazel${{ matrix.bazel }}
          repository-cache: true

      - name: bazel test //...
        run: bazelisk test //...

  # macOS is a smoke host only. Compile-heavy validation stays on Linux, with
  # the darwin target surface covered by the cross_compile analysis job below.
  macos-smoke:
    name: macos smoke (bazel 9.0.0)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-latest
    env:
      USE_BAZEL_VERSION: 9.0.0

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-macos-arm64-smoke-bazel9.0.0
          repository-cache: true

      - name: examples/basic gazelle smoke
        working-directory: examples/basic
        run: bazelisk run //:gazelle -- update -mode=diff

  # The full example suite is linux-only — it exercises the BUILD-generation
  # path and doesn't add platform-specific coverage worth the macOS runner cost.
  # Release validation covers the supported Bazel version matrix; regular CI
  # keeps PR feedback on the current Bazel line.
  # Each example runs as its own step (rather than a matrix entry) so the
  # whole set shares one runner and one Bazel install.
  # `if: ${{ !cancelled() }}` keeps later steps running after a failure so
  # we still see the full matrix of which examples are broken.
  examples:
    name: examples (bazel ${{ matrix.bazel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel: ["9.0.0"]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-examples-bazel${{ matrix.bazel }}
          repository-cache: true

      - name: examples/basic
        working-directory: examples/basic
        run: |
          bazelisk test //...
          bazelisk run //:gazelle -- update -mode=diff

      - name: examples/composite
        if: ${{ !cancelled() }}
        working-directory: examples/composite
        run: |
          bazelisk test //...
          bazelisk run //:gazelle -- update -mode=diff

      - name: examples/graphql
        if: ${{ !cancelled() }}
        working-directory: examples/graphql
        run: |
          bazelisk test //...
          bazelisk run //:gazelle -- update -mode=diff

      - name: examples/advanced
        if: ${{ !cancelled() }}
        working-directory: examples/advanced
        run: |
          bazelisk test //...
          bazelisk run //:gazelle -- update -mode=diff

  # cross_compile is special: it has no TypeScript source and no gazelle diff
  # to check — its job is to analyze a darwin-targeted gazelle_binary on a
  # Linux runner so the @macos_sdk visibility regression in gazelle_ts's
  # MODULE.bazel is caught before it ships. We use --nobuild because the
  # Linux runner has no Apple cc toolchain registered; the regression
  # manifests at analysis time, before linking is ever attempted.
  cross-compile:
    name: examples/cross_compile darwin analyze (bazel ${{ matrix.bazel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel: ["9.0.0"]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-cross_compile-bazel${{ matrix.bazel }}
          repository-cache: true

      - name: analyze darwin targets from linux
        working-directory: examples/cross_compile
        run: |
          set -euo pipefail
          for triple in aarch64-apple-darwin x86_64-apple-darwin; do
            echo "::group::--platforms=$triple"
            bazelisk build --nobuild "--platforms=@rules_rs//rs/platforms:$triple" //:gazelle_bin
            echo "::endgroup::"
          done
